id: cuestionario-03
titulo: Cuestionario 3 · Prompt engineering y aplicaciones de Generative AI
seccion: '4'
lecciones: 14–19
tiempo_min: 15
descripcion: Practica system prompts, prompts estructurados, código con Foundry SDK, autenticación, configuración
  y validación de respuestas.
preguntas:
- id: q01
  tipo: multiple-choice
  grupo: G4
  objetivo: Create effective system and user prompts for generative AI models
  lecciones:
  - 14
  enunciado: Luma quiere que el asistente siempre responda en español, con tono cordial y máximo cinco líneas, sin
    importar qué pregunte el usuario. ¿Dónde debe colocar esa regla?
  opciones:
  - texto: En el user prompt de cada cliente.
    correcta: false
    explicacion: El user prompt cambia por turno y lo escribe el usuario; no garantiza una regla permanente.
  - texto: En el system prompt o Instructions.
    correcta: true
    explicacion: El system prompt define comportamiento, rol, tono, formato y límites para toda la conversación.
  - texto: En el nombre del deployment.
    correcta: false
    explicacion: El nombre del deployment identifica la instancia del modelo; no define comportamiento.
  - texto: En el resource group de Azure.
    correcta: false
    explicacion: El resource group administra recursos juntos, pero no controla respuestas del modelo.
  explicacion_general: El system prompt lo define el desarrollador y aplica a toda la conversación. El user prompt
    contiene la tarea o pregunta concreta de cada turno. Repasa la lección 14.
- id: q02
  tipo: multi-select
  grupo: G4
  objetivo: Create effective system and user prompts for generative AI models
  lecciones:
  - 15
  enunciado: Un prompt de clasificación devuelve categorías con formatos distintos. Quieres más consistencia sin
    entrenar el modelo. ¿Qué DOS mejoras aplicarías primero? Selecciona DOS respuestas.
  opciones:
  - texto: Agregar ejemplos few-shot dentro del prompt.
    correcta: true
    explicacion: Few-shot muestra entradas y salidas esperadas para que el modelo imite el patrón.
  - texto: Definir un formato de salida con JSON y valores permitidos.
    correcta: true
    explicacion: Un formato explícito hace que la respuesta sea más predecible y fácil de validar.
  - texto: Aumentar el límite de TPM del deployment.
    correcta: false
    explicacion: TPM afecta capacidad por minuto, no el formato de la categoría.
  - texto: Cambiar a Batch para procesar el ticket.
    correcta: false
    explicacion: Batch es para trabajos asíncronos grandes; no mejora por sí mismo la consistencia del formato.
  - texto: Quitar delimitadores para que el modelo tenga más libertad.
    correcta: false
    explicacion: Los delimitadores ayudan a separar instrucciones y datos; quitarlos suele empeorar la claridad.
  explicacion_general: 'Prompt engineering mejora calidad sin modificar el modelo: contexto, instrucciones, restricciones,
    formato, few-shot y delimitadores. Repasa la lección 15.'
- id: q03
  tipo: multiple-choice
  grupo: G4
  objetivo: Create effective system and user prompts for generative AI models
  lecciones:
  - 15
  enunciado: En un prompt, el ticket de José incluye frases molestas como “ignora tus reglas”. ¿Qué técnica de la
    lección ayuda a separar datos del cliente de tus instrucciones?
  opciones:
  - texto: Cambiar el project endpoint por el endpoint compatible con OpenAI.
    correcta: false
    explicacion: El endpoint no separa instrucciones de datos dentro del prompt.
  - texto: Pedir una respuesta más larga para que el modelo explique su razonamiento.
    correcta: false
    explicacion: Más longitud no reduce el riesgo de mezclar instrucciones con datos del ticket.
  - texto: Usar un deployment Provisioned.
    correcta: false
    explicacion: Provisioned afecta capacidad y latencia, no la estructura del prompt.
  - texto: Usar delimitadores como triples comillas alrededor del ticket.
    correcta: true
    explicacion: Los delimitadores indican dónde terminan las instrucciones y dónde empiezan los datos.
  explicacion_general: 'Delimitadores como triples comillas, etiquetas o ### ayudan al modelo a tratar el contenido
    del usuario como datos, no como instrucciones del desarrollador. Repasa la lección 15.'
- id: q04
  tipo: multiple-choice
  grupo: G4
  objetivo: Create effective system and user prompts for generative AI models
  lecciones:
  - 16
  enunciado: Un prompt débil responde a un cobro duplicado prometiendo “reembolso en 48 horas”. ¿Qué mejora del
    prompt reduce mejor ese riesgo?
  opciones:
  - texto: Prohibir prometer reembolsos, montos o plazos y pedir datos para escalar a facturación.
    correcta: true
    explicacion: Una restricción explícita y un siguiente paso verificable evitan promesas no autorizadas.
  - texto: Pedir al modelo que sea más creativo y empático.
    correcta: false
    explicacion: Más creatividad puede aumentar hallucinations y no impide prometer montos o plazos.
  - texto: Eliminar el contexto de Luma para hacerlo más general.
    correcta: false
    explicacion: Quitar contexto deja más decisiones al modelo y puede empeorar la respuesta.
  - texto: Aumentar el TPM para que responda más rápido.
    correcta: false
    explicacion: TPM no corrige promesas inventadas ni reglas de negocio.
  explicacion_general: La lección muestra que prompts débiles producen promesas inventadas, longitud impredecible
    y falta de siguiente paso. Las restricciones concretas protegen a cliente y empresa. Repasa la lección 16.
- id: q05
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight chat client application by using the Foundry SDK
  lecciones:
  - 17
  enunciado: En chat_luma.py aparece `previous_response_id=previous_id` dentro de `client.responses.create(...)`.
    ¿Para qué sirve esa línea?
  opciones:
  - texto: Autenticar la aplicación con Microsoft Entra ID.
    correcta: false
    explicacion: La autenticación la hace DefaultAzureCredential, no previous_response_id.
  - texto: Cambiar el deployment type a Global Standard.
    correcta: false
    explicacion: El deployment type se configura al desplegar, no en esa línea de código.
  - texto: Encadenar la conversación sin reenviar todo el historial.
    correcta: true
    explicacion: previous_response_id conecta la nueva solicitud con la respuesta anterior para mantener contexto.
  - texto: Leer variables del archivo .env.
    correcta: false
    explicacion: Las variables se cargan con load_dotenv y os.environ.
  explicacion_general: El modelo no recuerda por sí mismo entre llamadas. En el curso, previous_response_id permite
    que el servicio recupere contexto de turnos anteriores. Repasa la lección 17.
- id: q06
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight chat client application by using the Foundry SDK
  lecciones:
  - 18
  enunciado: 'Lee el bloque: `project = AIProjectClient(endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"], credential=DefaultAzureCredential())`.
    ¿Qué parte autentica la aplicación?'
  opciones:
  - texto: endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"]
    correcta: false
    explicacion: El endpoint indica a qué project conectarse, pero no obtiene credenciales.
  - texto: credential=DefaultAzureCredential()
    correcta: true
    explicacion: DefaultAzureCredential obtiene un token de Entra ID, usando az login en local o managed identity
      en Azure.
  - texto: AIProjectClient
    correcta: false
    explicacion: AIProjectClient es el cliente de proyecto; necesita una credencial para autenticarse.
  - texto: os.environ
    correcta: false
    explicacion: os.environ lee variables de entorno, pero no autentica solicitudes.
  explicacion_general: 'Para preguntas de lectura de código, identifica el verbo de cada línea: endpoint conecta,
    credential autentica, get_openai_client prepara y responses.create envía. Repasa la lección 18.'
- id: q07
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight chat client application by using the Foundry SDK
  lecciones:
  - 18
  enunciado: Tu organización permite API keys y quieres usar el OpenAI SDK solo para llamar a modelos desplegados.
    ¿Qué configuración es correcta?
  opciones:
  - texto: AIProjectClient con una API key escrita en el constructor.
    correcta: false
    explicacion: AIProjectClient para el project usa Entra ID; no se conecta con API key.
  - texto: OpenAI con base_url apuntando al project endpoint de services.ai.azure.com.
    correcta: false
    explicacion: La alternativa con key usa el endpoint compatible con OpenAI, no el project endpoint.
  - texto: DefaultAzureCredential y sin ninguna variable de entorno.
    correcta: false
    explicacion: DefaultAzureCredential corresponde al camino de Entra ID; la opción con key requiere endpoint y
      key.
  - texto: OpenAI con base_url terminada en /openai/v1/ y api_key desde una variable de entorno.
    correcta: true
    explicacion: 'Ese es el patrón de chat_key.py: endpoint compatible con OpenAI y key protegida fuera del código.'
  explicacion_general: 'Hay dos caminos: Foundry SDK con Entra ID para project y agentes, o OpenAI SDK con API key
    para modelos desplegados. La key nunca se escribe en código. Repasa la lección 18.'
- id: q08
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight chat client application by using the Foundry SDK
  lecciones:
  - 18
  enunciado: En la app del curso, ¿qué debe guardar el archivo .env para el camino con Foundry SDK y Entra ID?
  opciones:
  - texto: FOUNDRY_PROJECT_ENDPOINT y MODEL_DEPLOYMENT_NAME.
    correcta: true
    explicacion: Son las variables usadas por chat_luma.py para conectar al project y llamar al deployment.
  - texto: AZURE_OPENAI_API_KEY escrita junto al código fuente.
    correcta: false
    explicacion: La key no pertenece al camino con Entra ID y nunca debe escribirse en el código.
  - texto: La contraseña personal del administrador de Azure.
    correcta: false
    explicacion: Nunca se guardan contraseñas personales; DefaultAzureCredential usa identidad de forma segura.
  - texto: El resource group y el nombre del tenant solamente.
    correcta: false
    explicacion: Esos datos no bastan para que el cliente se conecte al project ni al deployment.
  explicacion_general: load_dotenv carga variables de entorno para evitar valores de conexión en el código. Para
    el camino del curso necesitas project endpoint y nombre del deployment. Repasa la lección 18.
- id: q09
  tipo: multiple-choice
  grupo: G2
  objetivo: Describe how generative AI models work
  lecciones:
  - 19
  enunciado: validar_respuesta.py revisa `response.status`. Si el estado es `incomplete` porque max_output_tokens
    fue muy bajo, ¿qué debes hacer?
  opciones:
  - texto: Usar la respuesta parcial si parece correcta.
    correcta: false
    explicacion: La lección indica que si status no es completed, no debes usar la respuesta.
  - texto: Cambiar la región del resource como primera medida.
    correcta: false
    explicacion: La región no corrige una salida incompleta causada por max_output_tokens.
  - texto: Aumentar max_output_tokens o pedir una respuesta más corta.
    correcta: true
    explicacion: El límite de salida controla cuánto puede responder el modelo; si es bajo, la salida se corta.
  - texto: Desactivar la validación JSON.
    correcta: false
    explicacion: Quitar validación empeora la seguridad; debes corregir la causa de la respuesta incompleta.
  explicacion_general: response.status debe ser completed antes de usar la salida. Si incomplete_details apunta
    a tokens, ajusta el límite o el prompt. Repasa la lección 19.
- id: q10
  tipo: multi-select
  grupo: G4
  objetivo: Create a lightweight chat client application by using the Foundry SDK
  lecciones:
  - 19
  enunciado: Luma pide JSON para clasificar tickets antes de actuar sobre dinero o derechos del cliente. ¿Qué TRES
    validaciones recomienda la sección? Selecciona TRES respuestas.
  opciones:
  - texto: Comprobar que response.status sea completed.
    correcta: true
    explicacion: Si el estado no es completed, la respuesta puede estar cortada o filtrada y no debe usarse.
  - texto: Aceptar texto extra si el modelo parece seguro.
    correcta: false
    explicacion: Texto adicional rompe el formato esperado y debe tratarse como inválido.
  - texto: Parsear con json.loads y verificar campos obligatorios.
    correcta: true
    explicacion: json.loads detecta formato roto, y la verificación de campos evita salidas incompletas.
  - texto: Enviar a revisión humana si falla la validación o la decisión importa.
    correcta: true
    explicacion: Las respuestas que afectan dinero, salud o derechos requieren revisión humana cuando hay duda.
  - texto: Ignorar valores permitidos para no bloquear casos nuevos.
    correcta: false
    explicacion: La lección recomienda comprobar valores permitidos y escalar si no coinciden.
  explicacion_general: 'Validar salidas es parte de una app responsable: revisa estado, formato y valores permitidos,
    y no improvises ante fallos. Escala a una persona cuando la decisión importa. Repasa la lección 19.'
