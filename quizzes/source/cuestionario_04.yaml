id: cuestionario-04
titulo: Cuestionario 4 · AI Agents con Microsoft Foundry
seccion: '5'
lecciones: 20–24
tiempo_min: 15
descripcion: 'Preguntas de escenario sobre agentes en Microsoft Foundry: diseño, creación en el portal, cliente
  Python y validación de comportamiento.'
preguntas:
- id: q01
  tipo: multiple-choice
  grupo: G3
  objetivo: Identify scenarios for common AI workloads, including generative and agentic AI, text analysis, speech,
    computer vision, and information extraction
  lecciones:
  - 20
  enunciado: Luma quiere que un sistema responda si un router específico tiene garantía. El sistema debe buscar
    la política oficial, decidir si necesita más datos y responder dentro de límites definidos. ¿Qué describe mejor
    esa solución?
  opciones:
  - texto: Un modelo desplegado, porque recibe tokens y genera tokens sin herramientas.
    correcta: false
    explicacion: El modelo por sí solo genera texto, pero no recuerda entre llamadas ni usa tools para buscar o
      actuar.
  - texto: Una aplicación tradicional, porque el desarrollador programa cada paso y cada llamada.
    correcta: false
    explicacion: Una aplicación puede usar el modelo, pero aquí el sistema decide los pasos y qué tool usar para
      cumplir un objetivo.
  - texto: Un agent, porque combina modelo, instrucciones y tools para realizar tareas en nombre del usuario.
    correcta: true
    explicacion: El agent persigue un objetivo, decide pasos y usa tools dentro de límites definidos.
  - texto: Un índice de conocimiento, porque almacena documentos de políticas.
    correcta: false
    explicacion: El índice aporta knowledge, pero no decide ni responde por sí mismo como un agent.
  explicacion_general: En la lección 20 se separan modelo, aplicación y agent. Si el sistema decide qué pasos seguir
    y qué tool usar para cumplir un objetivo, el concepto correcto es agent, no solo modelo ni aplicación. Repasa
    la lección 20.
- id: q02
  tipo: multi-select
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 21
  enunciado: Estás diseñando las instrucciones de luma-soporte-agent antes de crearlo. ¿Qué DOS reglas pertenecen
    a esas instrucciones según el curso? Selecciona DOS respuestas.
  opciones:
  - texto: Para garantías o políticas, usar siempre file search sobre documentos de Luma.
    correcta: true
    explicacion: La instrucción obliga a usar file search para basar la respuesta en documentos de Luma.
  - texto: Confirmar reembolsos cuando el cliente ya proporcionó el número de cuenta.
    correcta: false
    explicacion: El agente no debe prometer ni confirmar reembolsos; debe informar y escalar cuando corresponda.
  - texto: Citar el documento usado y decirlo si la información no está disponible.
    correcta: true
    explicacion: Las instrucciones piden citar la fuente y admitir cuando los documentos no contienen la respuesta.
  - texto: Pedir datos de tarjeta para validar la identidad antes de responder.
    correcta: false
    explicacion: El curso establece que el asistente no pide contraseñas ni datos de tarjeta.
  explicacion_general: Las instrucciones del agent definen rol, uso de tools, citas y límites. Para Luma, file search
    y citas reducen respuestas de memoria, mientras que reembolsos y datos sensibles están fuera de alcance. Repasa
    la lección 21.
- id: q03
  tipo: multiple-choice
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 21
  enunciado: Un agent de Luma solo debe informar políticas internas almacenadas en documentos. El equipo propone
    agregar MCP para crear tickets y aprobar reembolsos. ¿Qué control aplica mejor el principio de mínimo privilegio?
  opciones:
  - texto: Habilitar todas las tools para evitar limitar al agent.
    correcta: false
    explicacion: Dar más tools de las necesarias aumenta el riesgo de acciones incorrectas o no autorizadas.
  - texto: Empezar con file search y agregar acciones solo si existen aprobaciones y permisos controlados.
    correcta: true
    explicacion: El curso recomienda empezar con knowledge y añadir acciones solo con controles como aprobación
      humana y mínimo privilegio.
  - texto: Usar web search porque puede encontrar información actual sobre cualquier política.
    correcta: false
    explicacion: Las políticas internas deben venir de documentos o índices empresariales, no de internet.
  - texto: Mover todas las reglas al prompt del usuario para que el cliente decida.
    correcta: false
    explicacion: Los límites deben estar en las instrucciones del agent, no depender del usuario.
  explicacion_general: Knowledge lee para responder; acciones cambian otros sistemas. Si el objetivo es informar
    políticas, file search es suficiente y las acciones requieren aprobación, identidad y permisos mínimos. Repasa
    la lección 21.
- id: q04
  tipo: multiple-choice
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 22
  enunciado: En el portal, ya configuraste gpt-5-mini con instrucciones y subiste politicas_luma.docx como file
    search. Quieres convertir esa configuración en un agent con nombre propio para usarlo después desde código.
    ¿Qué acción sigue?
  opciones:
  - texto: Abrir web search y guardar la consulta como fuente de conocimiento.
    correcta: false
    explicacion: Web search no convierte la configuración del playground en un agent.
  - texto: Copiar las instrucciones en cada llamada de la aplicación cliente.
    correcta: false
    explicacion: Cuando guardas el agent, las instrucciones viven dentro del agent y el cliente no las reenvía.
  - texto: Cambiar el deployment a un modelo de image generation.
    correcta: false
    explicacion: La tarea es de soporte conversacional con file search, no de generación de imágenes.
  - texto: Seleccionar Save as agent y nombrarlo luma-soporte-agent.
    correcta: true
    explicacion: Save as agent crea un agent con nombre y versión a partir de la configuración del playground.
  explicacion_general: 'La lección 22 muestra el flujo: modelo, instructions, file search y luego Save as agent.
    Foundry crea luma-soporte-agent con versión y definición YAML. Repasa la lección 22.'
- id: q05
  tipo: multiple-choice
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 22
  enunciado: Después de guardar la versión 1 de luma-soporte-agent, un evaluador pregunta “¿Cubren routers de otra
    marca?”. Los documentos de Luma no contienen esa política. ¿Cuál es el comportamiento esperado?
  opciones:
  - texto: Decir que no lo sabe con base en los documentos disponibles.
    correcta: true
    explicacion: Las instrucciones piden no inventar y reconocer cuando la información no está en los documentos.
  - texto: Responder con una práctica común de la industria de routers.
    correcta: false
    explicacion: Responder de memoria o con conocimiento genérico rompe el grounding requerido.
  - texto: Confirmar un reemplazo si el cliente proporciona número de serie.
    correcta: false
    explicacion: El agent no debe prometer reemplazos; además la pregunta está fuera de la política disponible.
  - texto: Buscar la respuesta en la web pública aunque sea una política interna.
    correcta: false
    explicacion: Para políticas internas de Luma, la fuente correcta es el documento indexado, no web search.
  explicacion_general: Las pruebas de comportamiento incluyen preguntas cubiertas, exclusiones, temas fuera de alcance
    y casos sin información. El agent debe preferir una negativa honesta a una respuesta inventada. Repasa la lección
    22.
- id: q06
  tipo: multi-select
  grupo: G4
  objetivo: Create a lightweight client application for an agent
  lecciones:
  - 23
  enunciado: 'Revisa este cliente Python para un agent: usa AIProjectClient, get_openai_client y client.responses.create(...).
    ¿Qué DOS afirmaciones son correctas para consumir luma-soporte-agent? Selecciona DOS respuestas.'
  opciones:
  - texto: Puede autenticarse con una API key del project igual que un endpoint de modelo simple.
    correcta: false
    explicacion: El acceso al project y a sus agents requiere Microsoft Entra ID; la lección advierte desconfiar
      de API key.
  - texto: agent_reference identifica el nombre y la versión del agent.
    correcta: true
    explicacion: La referencia incluye name, version y type para indicar qué agent usará la Responses API.
  - texto: El cliente debe reenviar model e instructions en cada turno.
    correcta: false
    explicacion: En un agent, el modelo, las instrucciones y las tools viven dentro del agent guardado.
  - texto: get_openai_client envía la pregunta final al agent.
    correcta: false
    explicacion: get_openai_client prepara la conexión; la solicitud se envía con responses.create.
  - texto: conversations.create permite mantener el historial en el servicio.
    correcta: true
    explicacion: La conversation guarda el historial y el código envía su id en cada turno.
  explicacion_general: El cliente de la lección 23 usa AIProjectClient con DefaultAzureCredential, una conversation
    y responses.create con extra_body que contiene agent_reference. No envía model ni instructions porque ya pertenecen
    al agent. Repasa la lección 23.
- id: q07
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight client application for an agent
  lecciones:
  - 23
  enunciado: En agente_luma.py, ¿qué línea es la que realmente envía la pregunta del cliente al agent según el curso?
  opciones:
  - texto: project = AIProjectClient(endpoint=..., credential=DefaultAzureCredential())
    correcta: false
    explicacion: Esa línea crea el cliente del project y configura la autenticación, pero no envía una pregunta.
  - texto: client = project.get_openai_client()
    correcta: false
    explicacion: Esa línea obtiene el cliente compatible con OpenAI; solo prepara la conexión.
  - texto: response = client.responses.create(input=pregunta, extra_body=AGENTE, ...)
    correcta: true
    explicacion: responses.create es la llamada que envía la entrada al agent mediante agent_reference.
  - texto: conversation = client.conversations.create()
    correcta: false
    explicacion: Esa línea crea el historial, pero no ejecuta la respuesta del agent.
  explicacion_general: El tip de examen de la lección 23 indica que responses.create envía la solicitud. AIProjectClient,
    get_openai_client y conversations.create preparan identidad, conexión e historial. Repasa la lección 23.
- id: q08
  tipo: multiple-choice
  grupo: G4
  objetivo: Create a lightweight client application for an agent
  lecciones:
  - 23
  enunciado: El equipo agregó una instrucción nueva y guardó la versión 2 del agent. La aplicación sigue usando
    agent_reference con version "1". ¿Qué ocurrirá al ejecutar la aplicación sin cambios?
  opciones:
  - texto: La aplicación fallará porque solo puede existir una versión activa del agent.
    correcta: false
    explicacion: Las versiones permiten que varias aplicaciones sigan apuntando a versiones distintas.
  - texto: La aplicación usará automáticamente la versión más reciente.
    correcta: false
    explicacion: El código referencia explícitamente nombre y versión; no cambia solo a la versión nueva.
  - texto: La aplicación deberá reenviar las instrucciones nuevas en input.
    correcta: false
    explicacion: Las instrucciones viven dentro del agent, no en el input del cliente.
  - texto: La aplicación seguirá usando el comportamiento de la versión 1 hasta cambiar la versión en el código.
    correcta: true
    explicacion: La lección muestra que apuntar a version 1 mantiene el comportamiento anterior aunque exista version
      2.
  explicacion_general: Las versiones permiten probar cambios sin romper aplicaciones existentes. Para adoptar la
    nueva instrucción, el cliente debe cambiar agent_reference a la versión correspondiente. Repasa la lección 23.
- id: q09
  tipo: multiple-choice
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 24
  enunciado: Una respuesta del agent sobre garantías suena correcta, pero no incluye cita ni evidencia de haber
    llamado a file search. ¿Cuál es la mejor forma de validarla?
  opciones:
  - texto: Aceptar la respuesta porque el texto coincide con lo esperado.
    correcta: false
    explicacion: Una respuesta puede sonar correcta y aun así ser incorrecta si no usó la fuente adecuada.
  - texto: Revisar trazas, response.output y citas para confirmar la llamada a file search.
    correcta: true
    explicacion: La lección 24 recomienda validar tools con trazas, response.output, citas y evaluations.
  - texto: Pedir al cliente que confirme si la política le parece razonable.
    correcta: false
    explicacion: La validación debe basarse en fuentes y tool calls, no en opinión del cliente.
  - texto: Agregar web search para que la respuesta tenga más contexto.
    correcta: false
    explicacion: La política de garantía debe venir del documento de Luma, no de la web pública.
  explicacion_general: El comportamiento correcto incluye usar file search antes de responder sobre políticas y
    citar el documento. En código, response.output puede mostrar elementos como file_search_call. Repasa la lección
    24.
- id: q10
  tipo: multiple-choice
  grupo: G4
  objetivo: Create and test a single-agent solution in the Foundry portal
  lecciones:
  - 21
  - 24
  enunciado: Luma quiere que el agent prepare una solicitud de reembolso por cobro duplicado, pero que nadie cobre
    ni prometa nada hasta que facturación revise el caso. ¿Qué patrón es el más adecuado?
  opciones:
  - texto: Aprobación humana antes de ejecutar una acción con impacto.
    correcta: true
    explicacion: Las acciones con impacto, como reembolsos, requieren aprobación previa y accountability.
  - texto: Permitir siempre la tool de pagos para reducir fricción.
    correcta: false
    explicacion: Eso viola mínimo privilegio y aumenta el riesgo de acciones no autorizadas.
  - texto: Usar solo un prompt largo para sustituir la revisión de facturación.
    correcta: false
    explicacion: Las instrucciones ayudan, pero no reemplazan controles para acciones de alto impacto.
  - texto: Desactivar guardrails para que el agent siga la intención del usuario.
    correcta: false
    explicacion: Los guardrails protegen entradas y salidas; no deben desactivarse para acciones sensibles.
  explicacion_general: 'Las lecciones 21 y 24 conectan acciones con controles: mínimo privilegio, aprobaciones y
    supervisión humana. Para reembolsos, el agent prepara evidencia y escala, no decide solo. Repasa las lecciones
    21 y 24.'
