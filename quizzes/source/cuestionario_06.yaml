id: cuestionario-06
titulo: Cuestionario 6 · Computer vision, generación de imágenes y Content Understanding
seccion: 8 y 9
lecciones: 34–43
tiempo_min: 15
descripcion: Preguntas de escenario sobre visión, generación de imágenes y extracción multimodal de información
  con Content Understanding.
preguntas:
- id: q01
  tipo: multiple-choice
  grupo: G3
  objetivo: Identify features and capabilities of computer vision and image-generation models
  lecciones:
  - 34
  enunciado: Luma necesita ubicar todos los routers visibles en una foto de almacén y dibujar un rectángulo alrededor
    de cada uno. ¿Qué tarea de computer vision corresponde?
  opciones:
  - texto: Semantic segmentation, porque clasifica cada píxel de la imagen.
    correcta: false
    explicacion: Segmentation daría píxeles por clase; el escenario pide rectángulos alrededor de objetos.
  - texto: Object detection, porque identifica qué objetos hay y dónde están con bounding boxes.
    correcta: true
    explicacion: Object detection responde qué objetos aparecen y dónde se ubican.
  - texto: Image classification, porque asigna una etiqueta a toda la imagen.
    correcta: false
    explicacion: Classification diría que la imagen contiene routers, pero no ubicaría cada uno.
  - texto: Image generation, porque crea una imagen nueva de routers.
    correcta: false
    explicacion: Image generation produce visuales nuevos; no analiza una foto existente.
  explicacion_general: 'La lección 34 resume: classification responde qué es, detection qué y dónde, segmentation
    qué píxeles y contextual analysis qué está pasando. Repasa la lección 34.'
- id: q02
  tipo: multi-select
  grupo: G6
  objetivo: Interpret visual input in prompts by using a deployed multimodal model
  lecciones:
  - 35
  - 38
  enunciado: Vas a pedir a gpt-5-mini que interprete una foto borrosa de un router en el playground. ¿Qué DOS instrucciones
    mejoran la confiabilidad de la respuesta? Selecciona DOS respuestas.
  opciones:
  - texto: Pide que distinga lo visible de lo supuesto y que no invente detalles.
    correcta: true
    explicacion: Separar visto de supuesto reduce detalles inventados y respuestas demasiado seguras.
  - texto: Pide que genere una imagen más nítida antes de contestar.
    correcta: false
    explicacion: Interpretar la foto no requiere image generation; el modelo debe reconocer incertidumbre.
  - texto: Indica que si la imagen no es clara, lo diga y pida otra foto.
    correcta: true
    explicacion: La lección 35 recomienda dar una salida explícita para la incertidumbre.
  - texto: Evita cualquier formato estructurado para que el modelo responda libremente.
    correcta: false
    explicacion: Pedir lista, tabla o JSON ayuda a que la respuesta sea utilizable.
  explicacion_general: Los prompts con imágenes deben ser concretos, pedir evidencia y admitir incertidumbre. Un
    resultado visual convincente puede ser incorrecto, sobre todo con baja resolución o mal ángulo. Repasa las lecciones
    35 y 38.
- id: q03
  tipo: multiple-choice
  grupo: G6
  objetivo: Create new visual outputs by using generative models
  lecciones:
  - 36
  enunciado: Marketing de Luma necesita una ilustración original de un router para la página de ayuda. ¿Qué prompt
    se alinea mejor con la guía del curso?
  opciones:
  - texto: Un router.
    correcta: false
    explicacion: 'Es débil: deja estilo, fondo, composición y restricciones al azar.'
  - texto: Haz algo moderno con internet.
    correcta: false
    explicacion: Es ambiguo y no define el sujeto ni restricciones necesarias.
  - texto: Ilustración plana de un router blanco con tres luces verdes, vista frontal, fondo claro, sin texto ni
      logotipos.
    correcta: true
    explicacion: Define sujeto, estilo, composición, fondo y restricciones, como recomienda la lección.
  - texto: Copia el logotipo de una marca conocida y ponlo en el router.
    correcta: false
    explicacion: El curso recomienda evitar marcas de terceros y usar generación responsable.
  explicacion_general: Un buen prompt de imagen especifica sujeto, estilo, composición, iluminación y restricciones.
    También debe evitar texto, logotipos o marcas de terceros cuando no corresponden. Repasa la lección 36.
- id: q04
  tipo: multiple-choice
  grupo: G6
  objetivo: Build a lightweight application that includes vision capabilities
  lecciones:
  - 37
  enunciado: En vision_luma.py, la app lee `router_cliente.jpg`, lo codifica en base64 y crea `data:image/jpeg;base64,...`.
    ¿Cómo se envía la imagen al modelo en la Responses API?
  opciones:
  - texto: Como parámetro `model`, reemplazando el nombre del deployment.
    correcta: false
    explicacion: model sigue siendo el deployment; la imagen viaja en el contenido del mensaje.
  - texto: Como archivo adjunto en SpeechConfig.
    correcta: false
    explicacion: SpeechConfig pertenece a Azure Speech, no a una solicitud multimodal de visión.
  - texto: Como analyzer_id de Content Understanding.
    correcta: false
    explicacion: analyzer_id se usa para extracción de información, no para prompts con visión.
  - texto: Como una parte de contenido `input_image` junto con `input_text`.
    correcta: true
    explicacion: La solicitud multimodal combina texto e imagen en el mismo mensaje.
  explicacion_general: La lección 37 muestra un contenido con input_text e input_image. La imagen puede ser una
    URL pública o un data URL en base64; output_text trae la interpretación. Repasa la lección 37.
- id: q05
  tipo: multiple-choice
  grupo: G6
  objetivo: Interpret visual input in prompts by using a deployed multimodal model
  lecciones:
  - 38
  enunciado: El modelo multimodal afirma con seguridad que leyó el número de serie en una etiqueta borrosa. La app
    debe guardar ese valor en una base de datos. ¿Qué enfoque es más adecuado?
  opciones:
  - texto: Aceptar el texto porque el modelo multimodal responde con confianza.
    correcta: false
    explicacion: La confianza en el lenguaje no garantiza que el texto pequeño se haya leído bien.
  - texto: Usar Content Understanding con un campo numero_serie y revisar score y ubicación.
    correcta: true
    explicacion: Para campos específicos de una imagen, Content Understanding da schema, confidence score y grounding.
  - texto: Generar una imagen nueva con un número de serie más claro.
    correcta: false
    explicacion: Generar una imagen no extrae ni valida el dato real del cliente.
  - texto: Usar Speech recognition para convertir la etiqueta en texto.
    correcta: false
    explicacion: Speech recognition procesa audio, no texto visible en una imagen.
  explicacion_general: 'La lección 38 conecta visión con extracción: para leer campos específicos como un número
    de serie, usa Content Understanding, no una descripción general. Repasa la lección 38.'
- id: q06
  tipo: multi-select
  grupo: G7
  objetivo: Extract information from documents and forms by using Azure Content Understanding in Foundry Tools
  lecciones:
  - 39
  enunciado: Diseñas un custom analyzer para facturas de Luma. ¿Qué DOS conceptos de Content Understanding debes
    incluir para obtener datos integrables? Selecciona DOS respuestas.
  opciones:
  - texto: Un schema con campos, tipos y descripciones en lenguaje natural.
    correcta: true
    explicacion: El schema define qué valores quieres obtener y guía la extracción.
  - texto: Un prompt para que el usuario final elija manualmente cada campo.
    correcta: false
    explicacion: La extracción debe estructurar automáticamente el contenido mediante el analyzer.
  - texto: Métodos de campo como extract, generate o classify según el tipo de valor.
    correcta: true
    explicacion: extract toma valores visibles, generate deduce o redacta y classify elige categorías.
  - texto: Una llamada a SpeechSynthesizer para convertir los campos en audio.
    correcta: false
    explicacion: SpeechSynthesizer no define ni extrae campos de documentos.
  explicacion_general: Content Understanding convierte contenido no estructurado en campos con significado. El analyzer
    usa un schema, métodos de campo, normalización, confidence scores y grounding. Repasa la lección 39.
- id: q07
  tipo: multiple-choice
  grupo: G7
  objetivo: Extract information from documents and forms by using Azure Content Understanding in Foundry Tools
  lecciones:
  - 40
  enunciado: En Content Understanding, analizas una factura escaneada. Primero obtienes líneas de texto; luego tablas
    y párrafos; finalmente campos como total y fecha. ¿Cuál es la secuencia correcta de analyzers?
  opciones:
  - texto: Image generation, Speech SDK y TextAnalyticsClient.
    correcta: false
    explicacion: Esas herramientas no corresponden a los niveles de análisis de documentos de Content Understanding.
  - texto: Read, Layout y un analyzer de dominio o custom.
    correcta: true
    explicacion: Read devuelve texto, Layout estructura y dominio/custom devuelve campos con significado.
  - texto: Web search, code interpreter y MCP.
    correcta: false
    explicacion: Son tools de agents, no analyzers para documentos.
  - texto: Classification, detection y segmentation.
    correcta: false
    explicacion: Son tareas de computer vision, no niveles de extracción documental.
  explicacion_general: La lección 40 compara Read, Layout y analyzers de dominio. El objetivo es pasar de texto
    a estructura y luego a campos de negocio en JSON. Repasa la lección 40.
- id: q08
  tipo: multiple-choice
  grupo: G7
  objetivo: Extract information from images by using Content Understanding
  lecciones:
  - 41
  enunciado: En una foto de etiqueta, el campo `estado_equipo` debe ser solo `sin_danos` o `danado`. ¿Qué método
    de campo del schema usa mejor esa lista cerrada?
  opciones:
  - texto: extract, porque copia siempre cualquier palabra visible.
    correcta: false
    explicacion: extract toma valores visibles; no elige entre categorías cerradas cuando debe clasificar el estado.
  - texto: generate, porque redacta un resumen libre del equipo.
    correcta: false
    explicacion: generate produce un valor nuevo, pero aquí se requiere una categoría cerrada.
  - texto: read, porque OCR decide el significado de cada valor.
    correcta: false
    explicacion: Read obtiene texto, pero no asigna por sí solo significado de campo.
  - texto: classify, porque elige entre opciones definidas en enum.
    correcta: true
    explicacion: classify selecciona una categoría de una lista cerrada, como sin_danos o danado.
  explicacion_general: En la lección 41, modelo, número de serie y MAC usan extract porque están visibles; estado_equipo
    usa classify con opciones definidas. Repasa la lección 41.
- id: q09
  tipo: multiple-choice
  grupo: G7
  objetivo: Extract information from audio and video by using Content Understanding
  lecciones:
  - 42
  enunciado: Luma quiere analizar miles de llamadas grabadas para obtener motivo, sentimiento y compromiso del agente
    sin escucharlas manualmente. ¿Qué solución encaja mejor?
  opciones:
  - texto: Un analyzer de audio de Content Understanding con campos classify y generate.
    correcta: true
    explicacion: Content Understanding extrae transcripción, resumen y campos definidos para audio.
  - texto: Un modelo de image generation con prompt de post-call analytics.
    correcta: false
    explicacion: Image generation no procesa llamadas grabadas ni genera campos de audio.
  - texto: Un prompt visual con input_image para cada llamada.
    correcta: false
    explicacion: input_image se usa para imágenes, no para grabaciones de llamadas.
  - texto: Solo OCR/Read, porque las llamadas contienen palabras.
    correcta: false
    explicacion: OCR lee texto en imágenes; para audio se requiere transcripción y extracción de campos.
  explicacion_general: La lección 42 muestra que del audio se extraen transcripción, resumen y campos como motivo,
    sentimiento y compromiso. classify y generate convierten la conversación en un registro. Repasa la lección 42.
- id: q10
  tipo: multiple-choice
  grupo: G7
  objetivo: Build a lightweight application with information extraction capabilities by using Content Understanding
  lecciones:
  - 43
  enunciado: En extraer_factura.py, después de `poller = client.begin_analyze(...)`, el código llama a `poller.result()`.
    ¿Por qué es necesario?
  opciones:
  - texto: Porque begin_analyze solo inicia una operación asíncrona y hay que esperar el resultado.
    correcta: true
    explicacion: Content Understanding procesa el contenido como trabajo asíncrono; result espera a que termine.
  - texto: Porque result convierte el texto extraído en audio con una neural voice.
    correcta: false
    explicacion: Eso corresponde a SpeechSynthesizer, no al poller de Content Understanding.
  - texto: Porque result cambia automáticamente de prebuilt-invoice a prebuilt-receipt.
    correcta: false
    explicacion: El analyzer se define en begin_analyze; result no cambia el analyzer.
  - texto: Porque result elimina la necesidad de validar campos y confidence scores.
    correcta: false
    explicacion: Después de obtener el resultado, la aplicación aún debe validar scores, formatos y reglas de negocio.
  explicacion_general: La lección 43 explica que begin_analyze envía el contenido y devuelve un poller. poller.result()
    espera el resultado; luego validas umbrales, formatos, duplicados y reglas de negocio. Repasa la lección 43.
